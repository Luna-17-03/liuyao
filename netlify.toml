# 这是最终的、语法完全正确的 netlify.toml 文件

# [build] 块告诉Netlify你的网站和函数在哪里
[build]
  publish = "hexagram-assistant"
  functions = "netlify/functions"

# [[redirects]] 块设置URL转发，让前端能访问后端函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200 # 200表示内部转发

# [functions."*"] 块使用通配符"*"为所有函数进行统一配置
# 这才是设置超时时间的正确语法
[functions."*"]
  # 将所有函数的“耐心”延长到26秒
  timeout = 26
